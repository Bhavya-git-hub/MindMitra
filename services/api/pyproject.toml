[project]
name = "mindmitra-api"
version = "0.1.0"
description = "MindMitra backend API (database layer in this phase)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "pyjwt[crypto]>=2.9",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "faker>=33",
  "mypy>=1.13",
  "ruff>=0.8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # autogenerated, reviewed by hand

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608", "E731", "B008"]
"app/infrastructure/db/seed/*" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false
warn_unused_ignores = false
